name: Canary
run-name: "Introspect Runner on ${{ github.repository }} by ${{ github.actor }} with ${{ github.event_name }} (Attempt ${{ github.run_attempt }})"

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'renovate/**'
      - 'dependabot/**'
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  canary:
    uses: Mimis-Gildi/fluffle/.github/workflows/runner-introspector.yml@main
