name: Label Pull Request
run-name: "Labeled Pull Request examining content on ${{ github.actor }} with ${{ github.event_name }}"

on:
  pull_request:
    branches-ignore:
      - 'renovate/**'
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  workflow_dispatch:

defaults:
  run:
    shell: zsh -l {0}

jobs:
  labeler:
    uses: Mimis-Gildi/fluffle/.github/workflows/labeler.yml@main
